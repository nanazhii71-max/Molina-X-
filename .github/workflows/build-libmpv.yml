name: build-libmpv

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - 'buildscripts/mpv/**'
      - '.github/workflows/build-libmpv.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - buildarch: armv7l
            abi: armeabi-v7a
          - buildarch: arm64
            abi: arm64-v8a
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: temurin

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf pkgconf libtool ninja-build python3-pip gperf nasm unzip wget
          sudo pip3 install --break-system-packages meson

      - name: Set executable permission pada semua build script mpv
        working-directory: buildscripts/mpv
        run: |
          chmod +x download.sh buildall.sh build-mpv.sh include/*.sh scripts/*.sh
          echo "=== Verifikasi permission ==="
          ls -la download.sh buildall.sh

      - name: Pin mpv ke v0.41.0 (stable, bukan master)
        working-directory: buildscripts/mpv
        run: |
          mkdir -p deps
          git clone --branch v0.41.0 --depth 1 https://github.com/mpv-player/mpv deps/mpv
          echo "Exit code clone mpv: $?"

      - name: Download SDK, NDK r28c (28.2.13676358 — dikunci sama dengan AGP), dan dependency source
        working-directory: buildscripts/mpv
        env:
          IN_CI: "1"
        run: |
          ./download.sh
          echo "Exit code download.sh: $?"

      - name: Build libmpv (${{ matrix.buildarch }})
        working-directory: buildscripts/mpv
        run: |
          ./buildall.sh mpv --arch ${{ matrix.buildarch }}
          echo "Exit code buildall.sh: $?"

      - name: Verifikasi output nyata
        working-directory: buildscripts/mpv
        run: |
          SO="prefix/${{ matrix.buildarch }}/lib/libmpv.so"
          test -f "$SO"
          echo "libmpv.so ditemukan, exit: $?"
          file "$SO"

      - name: Bundling native libs (libmpv + 7 dependency FFmpeg + libc++_shared)
        working-directory: buildscripts/mpv
        run: |
          . ./include/depinfo.sh

          STAGE="dist/${{ matrix.abi }}"
          mkdir -p "$STAGE"

          REQUIRED_SO="libmpv.so libavcodec.so libavfilter.so libavformat.so libavutil.so libavdevice.so libswresample.so libswscale.so"
          for so in $REQUIRED_SO; do
            SRC="prefix/${{ matrix.buildarch }}/lib/$so"
            test -f "$SRC"
            cp -v "$SRC" "$STAGE/"
          done

          NDK_ROOT="sdk/android-ndk-${v_ndk}"
          test -d "$NDK_ROOT"
          TOOLCHAIN=$(echo "$NDK_ROOT"/toolchains/llvm/prebuilt/*)
          test -d "$TOOLCHAIN"

          case "${{ matrix.buildarch }}" in
            armv7l) TRIPLE=arm-linux-androideabi ;;
            arm64)  TRIPLE=aarch64-linux-android ;;
            *) echo "Triple tidak dikenal untuk ${{ matrix.buildarch }}" >&2; exit 1 ;;
          esac

          LIBCXX="$TOOLCHAIN/sysroot/usr/lib/$TRIPLE/libc++_shared.so"
          test -f "$LIBCXX"
          cp -v "$LIBCXX" "$STAGE/"

          echo "=== Isi staging $STAGE ==="
          ls -la "$STAGE"

          echo "=== Verifikasi NEEDED libmpv.so terpenuhi semua dari file di staging ==="
          NEEDED=$(readelf -d "$STAGE/libmpv.so" | grep NEEDED | sed -E 's/.*\[(.*)\]/\1/')
          for dep in $NEEDED; do
            if [ -f "$STAGE/$dep" ]; then
              echo "OK (dibundel): $dep"
            else
              echo "SYSTEM LIB (tidak dibundel, wajib ada di device): $dep"
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: libmpv-${{ matrix.abi }}
          path: buildscripts/mpv/dist/${{ matrix.abi }}/

      - name: Staging prefix penuh (lib .so + include) — dipakai compile-time libplayer.so
        working-directory: buildscripts/mpv
        run: |
          set -euo pipefail
          PREFIX_STAGE="prefix-dist/${{ matrix.abi }}"
          mkdir -p "$PREFIX_STAGE/lib" "$PREFIX_STAGE/include"

          cp -v prefix/${{ matrix.buildarch }}/lib/*.so "$PREFIX_STAGE/lib/"
          cp -rv prefix/${{ matrix.buildarch }}/include/. "$PREFIX_STAGE/include/"

          echo "=== Isi $PREFIX_STAGE (2 level) ==="
          find "$PREFIX_STAGE" -maxdepth 2

          test -f "$PREFIX_STAGE/lib/libmpv.so"
          test -f "$PREFIX_STAGE/include/mpv/client.h"
          test -f "$PREFIX_STAGE/include/libavcodec/jni.h"
          test -f "$PREFIX_STAGE/include/libswscale/swscale.h"
          echo "Verifikasi header wajib libplayer.so: OK"

      - uses: actions/upload-artifact@v7
        with:
          name: mpv-prefix-${{ matrix.abi }}
          path: buildscripts/mpv/prefix-dist/${{ matrix.abi }}/
