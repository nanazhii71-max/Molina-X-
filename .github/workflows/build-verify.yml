name: Build Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-proot:
    name: Build proot (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    steps:
      - name: Checkout Molina-X
        uses: actions/checkout@v7

      - name: Setup Android NDK r28c (= 28.2.13676358)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false
          local-cache: false

      - name: Diagnostic - isi toolchain bin (bukti nyata, bukan asumsi)
        run: |
          set -euo pipefail
          ls -la "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/" | grep -E "llvm-ar|llvm-ranlib|llvm-strip|llvm-objcopy|llvm-objdump|clang"

      - name: Build libtalloc
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          chmod +x buildscripts/proot/*.sh
          ./buildscripts/proot/build-libtalloc.sh ${{ matrix.abi }}

      - name: Build libandroid-shmem
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          ./buildscripts/proot/build-libandroid-shmem.sh ${{ matrix.abi }}

      - name: Build proot
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          ./buildscripts/proot/build-proot.sh ${{ matrix.abi }}

      - name: Verifikasi checksum & arsitektur binary hasil build
        run: |
          set -euo pipefail
          sha256sum "native/proot/${{ matrix.abi }}/proot"
          file "native/proot/${{ matrix.abi }}/proot"

      - name: Upload artifact proot-${{ matrix.abi }}
        uses: actions/upload-artifact@v4
        with:
          name: proot-${{ matrix.abi }}
          path: native/proot/${{ matrix.abi }}/proot
          if-no-files-found: error
          retention-days: 14

  verify:
    name: Build & Verify APK
    needs: build-proot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept SDK licenses
        run: |
          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - name: Install Build-Tools 37.0.0, Platform 37.0
        run: |
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;37.0.0" \
            "platforms;android-37.0"

      - name: VERIFY packages actually installed on disk
        run: |
          test -d "${ANDROID_SDK_ROOT}/build-tools/37.0.0" && echo "Build-Tools 37.0.0: OK" || (echo "Build-Tools 37.0.0: MISSING" && exit 1)
          test -d "${ANDROID_SDK_ROOT}/platforms/android-37.0" && echo "Platform 37.0: OK" || (echo "Platform 37.0: MISSING" && exit 1)

      - name: Download proot arm64-v8a
        uses: actions/download-artifact@v4
        with:
          name: proot-arm64-v8a
          path: /tmp/proot-arm64-v8a

      - name: Download proot armeabi-v7a
        uses: actions/download-artifact@v4
        with:
          name: proot-armeabi-v7a
          path: /tmp/proot-armeabi-v7a

      - name: Tempatkan binary proot ke jniLibs (nama libproot.so, wajib lolos W^X Android 10+)
        run: |
          set -euo pipefail
          mkdir -p feature-terminal/src/main/jniLibs/arm64-v8a
          mkdir -p feature-terminal/src/main/jniLibs/armeabi-v7a
          cp /tmp/proot-arm64-v8a/proot feature-terminal/src/main/jniLibs/arm64-v8a/libproot.so
          cp /tmp/proot-armeabi-v7a/proot feature-terminal/src/main/jniLibs/armeabi-v7a/libproot.so
          chmod +x feature-terminal/src/main/jniLibs/arm64-v8a/libproot.so
          chmod +x feature-terminal/src/main/jniLibs/armeabi-v7a/libproot.so
          find feature-terminal/src/main/jniLibs -type f -exec ls -la {} \;

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK (Phase 3 — Terminal Runtime: proot binary terintegrasi)
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: VERIFY APK actually exists on disk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH" && echo "APK: OK ($(du -sh "$APK_PATH" | cut -f1))" || (echo "APK: MISSING at $APK_PATH" && find app/build/outputs -type f && exit 1)

      - name: VERIFY libtermux.so present in APK (arm64-v8a & armeabi-v7a)
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK_PATH" | grep -q "lib/arm64-v8a/libtermux.so" && echo "libtermux.so arm64-v8a: OK" || (echo "libtermux.so arm64-v8a: MISSING" && exit 1)
          unzip -l "$APK_PATH" | grep -q "lib/armeabi-v7a/libtermux.so" && echo "libtermux.so armeabi-v7a: OK" || (echo "libtermux.so armeabi-v7a: MISSING" && exit 1)

      - name: VERIFY libproot.so present in APK (arm64-v8a & armeabi-v7a)
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK_PATH" | grep -q "lib/arm64-v8a/libproot.so" && echo "libproot.so arm64-v8a: OK" || (echo "libproot.so arm64-v8a: MISSING" && exit 1)
          unzip -l "$APK_PATH" | grep -q "lib/armeabi-v7a/libproot.so" && echo "libproot.so armeabi-v7a: OK" || (echo "libproot.so armeabi-v7a: MISSING" && exit 1)

      - name: VERIFY extractNativeLibs=true di merged manifest (wajib untuk exec() proot)
        run: |
          MANIFEST="app/build/intermediates/merged_manifest/debug/AndroidManifest.xml"
          test -f "$MANIFEST" || MANIFEST=$(find app/build -name "AndroidManifest.xml" -path "*merged*" | head -1)
          grep -q 'extractNativeLibs="true"' "$MANIFEST" && echo "extractNativeLibs=true: OK" || (echo "extractNativeLibs: MISSING/false" && cat "$MANIFEST" && exit 1)

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MolinaX-debug-apk-phase3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
