# MolinaX Manager — root Gradle properties

# Wajib untuk seluruh dependency AndroidX (Compose, Activity, Navigation, dll)
android.useAndroidX=true

# R-class per modul tidak mewarisi resource modul lain — mencegah resource
# reference ambigu di struktur multi-module (app + core-common + 4 feature-*)
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
